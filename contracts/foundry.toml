[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[fmt]
line_length = 120

[lint]
# Deadlines are hours to weeks apart; a validator's few seconds of timestamp drift cannot change an outcome.
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
bohr = "https://rpc.bohr.life"
botchain = "https://rpc.botchain.ai"
local = "http://127.0.0.1:8545"
